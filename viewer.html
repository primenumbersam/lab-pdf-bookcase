<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipbook Viewer</title>
    <link rel="stylesheet" href="style.css">
    <!-- PDF.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- Page Flip Library -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
</head>

<body>
    <a href="index.html" class="home-btn">← Back to Bookshelf</a>

    <div class="viewer-container">
        <div id="loading" class="viewer-loading">도서 로딩 중...</div>
        <div id="book" class="flip-book" style="display: none;">
            <!-- Virtualized page containers will be injected here -->
        </div>

        <div class="controls">
            <button id="prevBtn">Previous</button>
            <span style="color: white; align-self: center;">Page <span id="page-num">1</span> of <span
                    id="total-page">--</span></span>
            <button id="nextBtn">Next</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
